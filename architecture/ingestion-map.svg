<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="655" viewBox="0 0 1200 655"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#535D71"/></marker></defs><rect width="100%" height="100%" fill="#F4F6FA"/><text x="35" y="45" font-family="Arial" font-size="28" fill="#151922" font-weight="700">Curriculum lifecycle: private and built-in</text><text x="35" y="77" font-family="Arial" font-size="17" fill="#535D71">Selected design; not a runtime result. Detailed guards and alternate paths in the accompanying specification.</text><rect x="35" y="110" width="336" height="125" rx="12" fill="#E4EAFF" stroke="#DCE1EB"/><text x="49" y="139" font-family="Arial" font-size="21" fill="#172F96" font-weight="700">1. Authorize + reserve</text><text x="49" y="167" font-family="Arial" font-size="17" fill="#535D71">Actor / learner / purpose</text><text x="49" y="190" font-family="Arial" font-size="17" fill="#535D71">Rights claim and upload quota</text><rect x="401" y="110" width="336" height="125" rx="12" fill="#FFFFFF" stroke="#DCE1EB"/><text x="415" y="139" font-family="Arial" font-size="21" fill="#172F96" font-weight="700">2. Quarantine</text><text x="415" y="167" font-family="Arial" font-size="17" fill="#535D71">Verify bytes / type / hash</text><text x="415" y="190" font-family="Arial" font-size="17" fill="#535D71">Private random object path</text><rect x="767" y="110" width="336" height="125" rx="12" fill="#E4EAFF" stroke="#DCE1EB"/><text x="781" y="139" font-family="Arial" font-size="21" fill="#172F96" font-weight="700">3. Scan + limit</text><text x="781" y="167" font-family="Arial" font-size="17" fill="#535D71">Isolated scanner process</text><text x="781" y="190" font-family="Arial" font-size="17" fill="#535D71">Failure holds; never bypass</text><rect x="767" y="285" width="336" height="125" rx="12" fill="#FFFFFF" stroke="#DCE1EB"/><text x="781" y="314" font-family="Arial" font-size="21" fill="#172F96" font-weight="700">4. Parse</text><text x="781" y="342" font-family="Arial" font-size="17" fill="#535D71">Docling in restricted worker</text><text x="781" y="365" font-family="Arial" font-size="17" fill="#535D71">No learner DB or broad egress</text><rect x="401" y="285" width="336" height="125" rx="12" fill="#E4EAFF" stroke="#DCE1EB"/><text x="415" y="314" font-family="Arial" font-size="21" fill="#172F96" font-weight="700">5. Validate + review</text><text x="415" y="342" font-family="Arial" font-size="17" fill="#535D71">Broker verifies manifest</text><text x="415" y="365" font-family="Arial" font-size="17" fill="#535D71">Flag uncertain extraction</text><rect x="35" y="285" width="336" height="125" rx="12" fill="#FFFFFF" stroke="#DCE1EB"/><text x="49" y="314" font-family="Arial" font-size="21" fill="#172F96" font-weight="700">6. Publish audience</text><text x="49" y="342" font-family="Arial" font-size="17" fill="#535D71">Private-ready for permitted use</text><text x="49" y="365" font-family="Arial" font-size="17" fill="#535D71">Built-in needs separate approval</text><rect x="35" y="460" width="336" height="125" rx="12" fill="#E4EAFF" stroke="#DCE1EB"/><text x="49" y="489" font-family="Arial" font-size="21" fill="#172F96" font-weight="700">7. Index version</text><text x="49" y="517" font-family="Arial" font-size="17" fill="#535D71">Collection + source anchors</text><text x="49" y="540" font-family="Arial" font-size="17" fill="#535D71">Lexical / dense, scoped ACL</text><rect x="401" y="460" width="336" height="125" rx="12" fill="#FFFFFF" stroke="#DCE1EB"/><text x="415" y="489" font-family="Arial" font-size="21" fill="#172F96" font-weight="700">8. Use with citations</text><text x="415" y="517" font-family="Arial" font-size="17" fill="#535D71">Tutor / practice source resolver</text><text x="415" y="540" font-family="Arial" font-size="17" fill="#535D71">Live access despite pinned edition</text><rect x="767" y="460" width="336" height="125" rx="12" fill="#E4EAFF" stroke="#DCE1EB"/><text x="781" y="489" font-family="Arial" font-size="21" fill="#172F96" font-weight="700">9. Withdraw / delete</text><text x="781" y="517" font-family="Arial" font-size="17" fill="#535D71">Deny + cancel queued work</text><text x="781" y="540" font-family="Arial" font-size="17" fill="#535D71">Purge derived assets and caches</text><path d="M371 172 L401 172" fill="none" stroke="#535D71" stroke-width="2" marker-end="url(#a)"/><path d="M737 172 L767 172" fill="none" stroke="#535D71" stroke-width="2" marker-end="url(#a)"/><path d="M935.0 235 L935.0 285" fill="none" stroke="#535D71" stroke-width="2" marker-end="url(#a)"/><path d="M767 347 L737 347" fill="none" stroke="#535D71" stroke-width="2" marker-end="url(#a)"/><path d="M401 347 L371 347" fill="none" stroke="#535D71" stroke-width="2" marker-end="url(#a)"/><path d="M203.0 410 L203.0 460" fill="none" stroke="#535D71" stroke-width="2" marker-end="url(#a)"/><path d="M371 522 L401 522" fill="none" stroke="#535D71" stroke-width="2" marker-end="url(#a)"/><path d="M737 522 L767 522" fill="none" stroke="#535D71" stroke-width="2" marker-end="url(#a)"/></svg>