<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1330" viewBox="0 0 1600 1330"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#535D71"/></marker></defs><rect width="1600" height="1330" fill="#F4F6FA"/><text x="50" y="52" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#151922">Sebaverse | Subject-independent architecture</text><text x="50" y="84" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#535D71">Selected technical design v1.0 | 11 November 2026 | Not implemented or benchmarked</text><rect x="50" y="115" width="480" height="100" rx="14" fill="#FFFFFF" stroke="#DCE1EB"/><text x="68" y="145" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#151922">Student</text><text x="68" y="173" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">Subjects / sources / tutor / independent practice</text><rect x="560" y="115" width="480" height="100" rx="14" fill="#FFFFFF" stroke="#DCE1EB"/><text x="578" y="145" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#151922">Parent</text><text x="578" y="173" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">Verified relationship / permitted progress</text><rect x="1070" y="115" width="480" height="100" rx="14" fill="#FFFFFF" stroke="#DCE1EB"/><text x="1088" y="145" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#151922">Educator / operator</text><text x="1088" y="173" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">Review / publication / appeals / operations</text><path d="M290 215 L290 245" stroke="#535D71" stroke-width="2" marker-end="url(#arrow)"/><path d="M800 215 L800 245" stroke="#535D71" stroke-width="2" marker-end="url(#arrow)"/><path d="M1310 215 L1310 245" stroke="#535D71" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="250" width="1500" height="110" rx="14" fill="#E4EAFF" stroke="#DCE1EB"/><text x="68" y="280" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#151922">One web product + same-origin API</text><text x="68" y="308" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">React + TypeScript + Vite | Django + DRF / ASGI | REST commands + authenticated SSE</text><text x="68" y="333" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">Server-side sessions / CSRF | live consent, object permissions, entitlement and spend checks</text><path d="M800 360 L800 390" stroke="#535D71" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="400" width="350" height="145" rx="14" fill="#FFFFFF" stroke="#DCE1EB"/><text x="68" y="430" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#151922">Curriculum + ingestion</text><text x="68" y="458" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">Systems / subjects / editions</text><text x="68" y="483" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">Private + built-in materials</text><text x="68" y="508" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">Rights / source anchors / versions</text><rect x="430" y="400" width="350" height="145" rx="14" fill="#FFFFFF" stroke="#DCE1EB"/><text x="448" y="430" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#151922">Tutor + learning policy</text><text x="448" y="458" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">Versioned subject profiles</text><text x="448" y="483" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">Bounded actions / typed tools</text><text x="448" y="508" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">Deterministic authority</text><rect x="810" y="400" width="350" height="145" rx="14" fill="#FFFFFF" stroke="#DCE1EB"/><text x="828" y="430" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#151922">Assessment + evidence</text><text x="828" y="458" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">Reviewed items / rubrics</text><text x="828" y="483" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">Independent vs assisted</text><text x="828" y="508" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">Correction / replay / due review</text><rect x="1190" y="400" width="360" height="145" rx="14" fill="#FFFFFF" stroke="#DCE1EB"/><text x="1208" y="430" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#151922">Access + operations</text><text x="1208" y="458" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">Consent / grants / usage</text><text x="1208" y="483" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">Parent reports / future teacher</text><text x="1208" y="508" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">Release / incidents / privacy</text><path d="M225 545 L225 580" stroke="#535D71" stroke-width="2" marker-end="url(#arrow)"/><path d="M605 545 L605 580" stroke="#535D71" stroke-width="2" marker-end="url(#arrow)"/><path d="M985 545 L985 580" stroke="#535D71" stroke-width="2" marker-end="url(#arrow)"/><path d="M1370 545 L1370 580" stroke="#535D71" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="590" width="480" height="140" rx="14" fill="#E4EAFF" stroke="#DCE1EB"/><text x="68" y="620" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#151922">Scoped retrieval</text><text x="68" y="648" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">PostgreSQL lexical + pgvector</text><text x="68" y="673" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">Exact filtered search baseline</text><text x="68" y="698" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">Source/version/page citation resolver</text><rect x="560" y="590" width="480" height="140" rx="14" fill="#FFE8D9" stroke="#DCE1EB"/><text x="578" y="620" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#151922">Provider gateway</text><text x="578" y="648" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">Eligible text / embed / STT / TTS</text><text x="578" y="673" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">Budget / usage receipts / cancellation</text><text x="578" y="698" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">Rules first; Jev classifier experiment</text><rect x="1070" y="590" width="480" height="140" rx="14" fill="#FFFFFF" stroke="#DCE1EB"/><text x="1088" y="620" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#151922">Durable work</text><text x="1088" y="648" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">PostgreSQL jobs + outbox</text><text x="1088" y="673" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">Leases / fencing / bounded retries</text><text x="1088" y="698" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">No Redis/Celery required initially</text><path d="M290 730 L290 770" stroke="#535D71" stroke-width="2" marker-end="url(#arrow)"/><path d="M800 730 L800 770" stroke="#535D71" stroke-width="2" marker-end="url(#arrow)"/><path d="M1310 730 L1310 770" stroke="#535D71" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="780" width="480" height="140" rx="14" fill="#FFFFFF" stroke="#DCE1EB"/><text x="68" y="810" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#151922">Authoritative PostgreSQL</text><text x="68" y="838" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">Curriculum / actors / evidence / usage</text><text x="68" y="863" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">pgvector selected extension</text><text x="68" y="888" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">No model writes roles, money, mastery</text><rect x="560" y="780" width="480" height="140" rx="14" fill="#FFFFFF" stroke="#DCE1EB"/><text x="578" y="810" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#151922">Private object storage</text><text x="578" y="838" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">Quarantine / accepted / derived assets</text><text x="578" y="863" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">Authorized scoped access</text><text x="578" y="888" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">Delete / rights withdrawal propagation</text><rect x="1070" y="780" width="480" height="140" rx="14" fill="#FFFFFF" stroke="#DCE1EB"/><text x="1088" y="810" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#151922">Isolated upload processing</text><text x="1088" y="838" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">ClamAV boundary + Docling parser</text><text x="1088" y="863" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">PaddleOCR fallback only if useful</text><text x="1088" y="888" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">No learner DB keys or broad egress</text><path d="M290 920 L290 955" stroke="#535D71" stroke-width="2" marker-end="url(#arrow)"/><path d="M800 920 L800 955" stroke="#535D71" stroke-width="2" marker-end="url(#arrow)"/><path d="M1310 920 L1310 955" stroke="#535D71" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="965" width="735" height="125" rx="14" fill="#E4EAFF" stroke="#DCE1EB"/><text x="68" y="995" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#151922">Evaluation + delivery</text><text x="68" y="1023" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">Own fixtures + pytest / Playwright / Promptfoo offline</text><text x="68" y="1048" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">OpenTelemetry metadata | versioned releases / CI / restore</text><rect x="815" y="965" width="735" height="125" rx="14" fill="#FFE8D9" stroke="#DCE1EB"/><text x="833" y="995" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#151922">Ready-component policy</text><text x="833" y="1023" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">Adopt bounded libraries, not an entire tutoring platform</text><text x="833" y="1048" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">DeepTutor: reference only | LearnHouse: deferred | EduStudio pin: quarantine</text><rect x="50" y="1120" width="1500" height="125" rx="14" fill="#FFFFFF" stroke="#DCE1EB"/><text x="68" y="1150" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#151922">Adding another subject</text><text x="68" y="1178" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">Reviewed profile + curriculum/material versions + item/rubric configuration; same core and APIs.</text><text x="68" y="1203" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#535D71">New specialist grading/representation capabilities use reviewed adapters. No particular textbook is an architecture dependency.</text><text x="50" y="1290" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#535D71">Detailed runtime, ER and state diagrams + all 99 requirements and 22 audited repositories are included in the audit pack.</text></svg>