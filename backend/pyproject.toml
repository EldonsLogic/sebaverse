[project]
name = "sebaverse-backend"
version = "0.0.0"
description = "Sebaverse backend dependency foundation; product application not implemented"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Django==5.2.19",
  "djangorestframework==3.18.3",
  "uvicorn==0.54.0",
  "psycopg[binary]==3.3.8",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-django==4.14.0",
]

[tool.uv]
package = false
index-strategy = "first-index"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
