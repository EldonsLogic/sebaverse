<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><rect width="1200" height="850" fill="#F4F6FA"/><text x="35" y="46" font-family="Arial" font-size="29" font-weight="700" fill="#151922">Domain entity map and authority boundaries</text><text x="35" y="78" font-family="Arial" font-size="17" fill="#535D71">Grouped entities; exact relations/cardinalities and invariants are specified in the editable data model.</text><rect x="35" y="120" width="530" height="175" rx="12" fill="#FFFFFF" stroke="#DCE1EB"/><text x="50" y="152" font-family="Arial" font-size="22" fill="#172F96" font-weight="700">Identity and consent</text><text x="50" y="188" font-family="Arial" font-size="18" fill="#535D71">User / Tenant / Membership</text><text x="50" y="216" font-family="Arial" font-size="18" fill="#535D71">LearnerProfile / GuardianRelationship</text><text x="50" y="244" font-family="Arial" font-size="18" fill="#535D71">ConsentRecord / purpose and revocation</text><rect x="635" y="120" width="530" height="175" rx="12" fill="#E4EAFF" stroke="#DCE1EB"/><text x="650" y="152" font-family="Arial" font-size="22" fill="#172F96" font-weight="700">Curriculum and subject configuration</text><text x="650" y="188" font-family="Arial" font-size="18" fill="#535D71">Subject / EducationSystem / Specification</text><text x="650" y="216" font-family="Arial" font-size="18" fill="#535D71">CurriculumEditionVersion / ProfileVersion</text><text x="650" y="244" font-family="Arial" font-size="18" fill="#535D71">Objective / Concept / reviewed mapping</text><rect x="35" y="350" width="530" height="175" rx="12" fill="#FFFFFF" stroke="#DCE1EB"/><text x="50" y="382" font-family="Arial" font-size="22" fill="#172F96" font-weight="700">Source and retrieval lineage</text><text x="50" y="418" font-family="Arial" font-size="18" fill="#535D71">RightsRecord / MaterialVersion</text><text x="50" y="446" font-family="Arial" font-size="18" fill="#535D71">Extraction / Chunk / CollectionManifest</text><text x="50" y="474" font-family="Arial" font-size="18" fill="#535D71">IndexManifest / embedding version</text><rect x="635" y="350" width="530" height="175" rx="12" fill="#E4EAFF" stroke="#DCE1EB"/><text x="650" y="382" font-family="Arial" font-size="22" fill="#172F96" font-weight="700">Course access and session context</text><text x="650" y="418" font-family="Arial" font-size="18" fill="#535D71">CourseOffering / Enrollment / Entitlement</text><text x="650" y="446" font-family="Arial" font-size="18" fill="#535D71">TutorSession / Turn / cancellation generation</text><text x="650" y="474" font-family="Arial" font-size="18" fill="#535D71">Approved curriculum/profile/release pins</text><rect x="35" y="580" width="530" height="175" rx="12" fill="#FFFFFF" stroke="#DCE1EB"/><text x="50" y="612" font-family="Arial" font-size="22" fill="#172F96" font-weight="700">Assessment and learning evidence</text><text x="50" y="648" font-family="Arial" font-size="18" fill="#535D71">ItemFamily / ItemVersion / RubricVersion</text><text x="50" y="676" font-family="Arial" font-size="18" fill="#535D71">Attempt / EvidenceEvent / CorrectionEvent</text><text x="50" y="704" font-family="Arial" font-size="18" fill="#535D71">KnowledgeProjection / ReviewSchedule</text><rect x="635" y="580" width="530" height="175" rx="12" fill="#E4EAFF" stroke="#DCE1EB"/><text x="650" y="612" font-family="Arial" font-size="22" fill="#172F96" font-weight="700">Accounting and controlled operations</text><text x="650" y="648" font-family="Arial" font-size="18" fill="#535D71">Reservation / CallAttempt / UsageReceipt</text><text x="650" y="676" font-family="Arial" font-size="18" fill="#535D71">PaymentEvent / Job / Outbox / AuditEvent</text><text x="650" y="704" font-family="Arial" font-size="18" fill="#535D71">ReleaseManifest / EvalRun / Appeal / Incident</text><path d="M565 208L635 208" stroke="#535D71" stroke-width="2"/><path d="M300 295L300 350" stroke="#535D71" stroke-width="2"/><path d="M900 295L900 350" stroke="#535D71" stroke-width="2"/><path d="M565 438L635 438" stroke="#535D71" stroke-width="2"/><path d="M300 525L300 580" stroke="#535D71" stroke-width="2"/><path d="M900 525L900 580" stroke="#535D71" stroke-width="2"/><path d="M565 668L635 668" stroke="#535D71" stroke-width="2"/><text x="35" y="815" font-family="Arial" font-size="17" fill="#535D71">All associations enforce live scope/version consistency; no model writes roles, consent, money or learning projections.</text></svg>