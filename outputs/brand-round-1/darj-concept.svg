<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680"><title>Darj: exploratory brand concept</title><rect width="1100" height="680" fill="#F8F7F2"/><text x="60" y="55" font-family="Arial,sans-serif" font-size="13" letter-spacing="3" fill="#61655F">TBD / BRAND EXPLORATION / NOT SELECTED</text><g transform="translate(60 105)" color="#3244A8"><path d="M22 82h22V61h22V40h22" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></g><text x="190" y="185" font-family="Arial,sans-serif" font-size="76" font-weight="700" letter-spacing="-3" fill="#3244A8">Darj</text><text x="65" y="270" font-family="Arial,sans-serif" font-size="34" fill="#1E2C29">One clear step forward.</text><text x="65" y="315" font-family="Arial,sans-serif" font-size="18" fill="#61655F">Confident, structured, purposeful</text><rect x="60" y="365" width="300" height="190" rx="22" fill="#3244A8"/><g transform="translate(155 408)" color="#FFFFFF"><path d="M22 82h22V61h22V40h22" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="390" y="365" width="300" height="190" rx="22" fill="#F0B7A4"/><g transform="translate(485 408)" color="#3244A8"><path d="M22 82h22V61h22V40h22" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="720" y="365" width="300" height="190" rx="22" fill="#202820"/><g transform="translate(815 408)" color="#FFFFFF"><path d="M22 82h22V61h22V40h22" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></g><text x="65" y="610" font-family="Arial,sans-serif" font-size="15" fill="#61655F">Original vector sketch. Lettering provisional. Name, mark and slogan clearance pending.</text><text x="65" y="639" font-family="Arial,sans-serif" font-size="15" fill="#61655F">A multi-subject tutor. German with an uploaded curriculum is the first use case.</text></svg>