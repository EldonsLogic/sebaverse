<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680"><title>Fahmori: exploratory brand concept</title><rect width="1100" height="680" fill="#F8F7F2"/><text x="60" y="55" font-family="Arial,sans-serif" font-size="13" letter-spacing="3" fill="#61655F">TBD / BRAND EXPLORATION / NOT SELECTED</text><g transform="translate(60 105)" color="#0B6058"><path d="M30 80V30h52M30 54h39" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round"/><circle cx="83" cy="79" r="9" fill="currentColor"/></g><text x="190" y="185" font-family="Arial,sans-serif" font-size="76" font-weight="700" letter-spacing="-3" fill="#0B6058">Fahmori</text><text x="65" y="270" font-family="Arial,sans-serif" font-size="34" fill="#1E2C29">Understanding that stays.</text><text x="65" y="315" font-family="Arial,sans-serif" font-size="18" fill="#61655F">Warm, clear, grounded</text><rect x="60" y="365" width="300" height="190" rx="22" fill="#0B6058"/><g transform="translate(155 408)" color="#FFFFFF"><path d="M30 80V30h52M30 54h39" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round"/><circle cx="83" cy="79" r="9" fill="currentColor"/></g><rect x="390" y="365" width="300" height="190" rx="22" fill="#E8B44D"/><g transform="translate(485 408)" color="#0B6058"><path d="M30 80V30h52M30 54h39" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round"/><circle cx="83" cy="79" r="9" fill="currentColor"/></g><rect x="720" y="365" width="300" height="190" rx="22" fill="#202820"/><g transform="translate(815 408)" color="#FFFFFF"><path d="M30 80V30h52M30 54h39" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round"/><circle cx="83" cy="79" r="9" fill="currentColor"/></g><text x="65" y="610" font-family="Arial,sans-serif" font-size="15" fill="#61655F">Original vector sketch. Lettering provisional. Name, mark and slogan clearance pending.</text><text x="65" y="639" font-family="Arial,sans-serif" font-size="15" fill="#61655F">A multi-subject tutor. German with an uploaded curriculum is the first use case.</text></svg>