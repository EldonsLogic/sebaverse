*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 var(--f-ui);font-kerning:normal}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 40px}
.toc{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;margin:28px 0 0}
.toc a{text-decoration:none;opacity:.8}
.sec{padding:64px 0 40px}
.sec-h{display:flex;align-items:baseline;gap:18px;margin:0 0 8px}
.sec-h .n{font:600 15px/1 var(--f-ui);opacity:.65}
.sec-h h2{margin:0;font:var(--h2)}
.lede{max-width:760px;font-size:18px;line-height:1.6;margin:8px 0 28px;color:var(--fg2)}
h3.sub{font:var(--h3);margin:40px 0 14px}
p{margin:0 0 12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:22px}
.k{font-size:13px;color:var(--fg2);font-weight:500}
.ar{direction:rtl;text-align:right;font-family:var(--f-ar-body)}
.arui{direction:rtl;text-align:right;font-family:var(--f-ar-ui)}
.note{font-size:13.5px;color:var(--fg2)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-weight:600}
.tbl td.ar,.tbl th.ar{text-align:right}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
code{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:.88em;background:var(--code-bg);padding:1px 5px;border-radius:4px}
pre{font:12.5px/1.55 'IBM Plex Mono',ui-monospace,monospace;background:var(--code-bg);padding:16px;border-radius:10px;overflow:auto;white-space:pre}
.logo-stage{display:flex;align-items:center;justify-content:center;min-height:220px;border-radius:var(--r-card);border:1px solid var(--line);padding:30px;position:relative}
.logo-stage .cap{position:absolute;left:14px;bottom:10px;font-size:12px;opacity:.75}
.logo-stage svg{max-width:100%;height:auto}
.small-test{display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap;padding:24px;border:1px solid var(--line);border-radius:var(--r-card);background:var(--card)}
.small-test figure{margin:0;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.small-test figcaption{font-size:11.5px;color:var(--fg2)}
.cs-box{position:relative;display:inline-block;outline:1px dashed var(--accent-line);background:repeating-linear-gradient(45deg,transparent 0 6px,var(--hatch) 6px 7px)}
.cs-box .inner{background:var(--card);display:block}
.wrong{position:relative}
.wrong .x{position:absolute;top:8px;right:10px;color:#B3261E;font-weight:700}
.wrong .logo-stage{min-height:150px}
.sw-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sw{border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--card);font-size:12.5px}
.sw .chip{height:76px}
.sw .meta{padding:9px 10px}
.sw .meta b{display:block;font-size:13px}
.sw .meta span{display:block;color:var(--fg2)}
.prop{display:flex;height:46px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.prop div{display:flex;align-items:flex-end;padding:6px 8px;font-size:11px}
.spec{border:1px solid var(--line);border-radius:var(--r-card);background:var(--card);padding:22px 26px;margin:0 0 16px}
.spec .meta{font-size:12px;color:var(--fg2);margin-bottom:8px;direction:ltr;text-align:left}
.scale td{white-space:nowrap}
.mirror{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mirror .card{display:flex;flex-direction:column;gap:10px}
.mi{display:flex;align-items:center;gap:14px;font-size:14px}
.mi .pair{display:flex;gap:6px;direction:ltr;min-width:84px}
.mi .pair span{display:inline-flex;width:36px;height:36px;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.flip{transform:scaleX(-1)}
.motion-demo{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.mdbox{width:180px;height:150px;border:1px solid var(--line);border-radius:var(--r-card);display:flex;align-items:center;justify-content:center;background:var(--card);position:relative;flex-direction:column;gap:8px;font-size:12px}
.apps{display:flex;flex-direction:column;gap:46px}
.appfig{margin:0}
.appfig figcaption{font-size:14px;margin:12px 0 0;color:var(--fg2)}
.appfig figcaption b{color:var(--fg)}
.phones{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.ic{display:inline-block;vertical-align:middle;flex:none}
/* ---- device frames */
.phone{width:360px;height:760px;border-radius:46px;background:#1B1D22;padding:9px;box-shadow:0 1px 0 rgba(255,255,255,.08) inset;flex:none}
.screen{width:100%;height:100%;border-radius:38px;overflow:hidden;background:var(--app-bg);position:relative;display:flex;flex-direction:column;font-family:var(--f-ar-ui);color:var(--app-fg);text-align:right}
.sbar{display:flex;justify-content:space-between;padding:14px 26px 6px;font:600 13px/1 -apple-system,'IBM Plex Sans',sans-serif;color:var(--app-fg)}
.sbar.dk{color:#fff}
.sbar .sb-r{letter-spacing:1px;font-size:10px}
.tabbar{position:absolute;bottom:0;left:0;right:0;height:72px;display:flex;justify-content:space-around;align-items:center;padding-bottom:12px;border-top:1px solid var(--line);background:var(--app-card);color:var(--fg2)}
.tabbar .ic:first-child{color:var(--app-fg)}
.browser{border-radius:14px;overflow:hidden;border:1px solid #C9CBD1;background:#fff;width:100%;max-width:1160px}
.bbar{height:42px;display:flex;align-items:center;gap:14px;padding:0 14px;background:#E8E9ED;font:12.5px/1 -apple-system,'IBM Plex Sans',sans-serif;color:#333}
.bbar .dots{display:flex;gap:6px}.bbar .dots i{width:11px;height:11px;border-radius:50%;background:#C4C6CC;display:block}
.bbar .tab{display:flex;align-items:center;gap:7px;background:#fff;padding:7px 14px;border-radius:8px}
.bbar .tab svg{width:16px;height:16px;border-radius:3px}
.bbar .url{flex:1;background:#fff;border-radius:7px;padding:6px 12px;color:#555}
.bview{height:660px;overflow:hidden;background:var(--app-bg);color:var(--app-fg);font-family:var(--f-ar-ui);position:relative;text-align:right}
.social{width:540px;height:540px;position:relative;overflow:hidden;flex:none}
.blank{display:inline-block;min-width:52px;height:1em;border-bottom:2px solid #8A93A6;color:transparent;line-height:1;vertical-align:-2px;margin:0 3px}
.homegrid{width:360px;height:520px;border-radius:30px;padding:40px 26px;display:grid;grid-template-columns:repeat(4,1fr);gap:22px 18px;align-content:start;background:linear-gradient(160deg,#5B6B7F,#2C3442)}
.homegrid .app{display:flex;flex-direction:column;align-items:center;gap:6px;font:11px/1.2 -apple-system,'IBM Plex Sans',sans-serif;color:#fff}
.homegrid .app .ico{width:62px;height:62px;border-radius:15px;background:rgba(255,255,255,.22);overflow:hidden}
.homegrid .app .ico svg{width:100%;height:100%;display:block}
.tabs-demo{display:flex;flex-direction:column;gap:14px}
.tabstrip{display:flex;gap:4px;background:#DEE1E6;padding:8px 8px 0;border-radius:10px 10px 0 0;width:520px}
.tabstrip.dark{background:#202124}
.tabstrip .t{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px 8px 0 0;font:12.5px -apple-system,'IBM Plex Sans',sans-serif;color:#333;min-width:150px}
.tabstrip .t.on{background:#fff}
.tabstrip.dark .t{color:#ddd}.tabstrip.dark .t.on{background:#35363A}
.tabstrip .t svg{width:16px;height:16px;border-radius:3px}
.ds-table td:first-child{width:28%}
