name: Static PostgreSQL remediation experiment
on:
  push:
    paths:
      - 'infra/local/postgres/**'
      - 'tools/security/**'
      - 'tools/tests/test_postgres_candidate.py'
      - 'tools/tests/test_ci_native_transaction.py'
      - '.github/workflows/postgres-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: postgres-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inspect-static-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GRYPE_DB_CACHE_DIR: ${{ github.workspace }}/work/cache/grype-db
      GRYPE_CHECK_FOR_APP_UPDATE: 'false'
      SYFT_CHECK_FOR_APP_UPDATE: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Verify authored candidate and static-only build helpers
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_postgres_*.py'
          python3 -m unittest discover -s tools/tests -p 'test_ci_native_*.py'
      - name: Enable existing daemon OCI storage on this disposable runner only
        run: |
          test "$GITHUB_ACTIONS" = "true"
          test -z "$(docker ps -aq)"
          mkdir -p work/f2-security
          sudo python3 - <<'PYCONFIG'
          from pathlib import Path
          import json
          path=Path('/etc/docker/daemon.json')
          data=json.loads(path.read_text()) if path.exists() else {}
          data.setdefault('features',{})['containerd-snapshotter']=True
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(data))
          PYCONFIG
          sudo systemctl restart docker
          docker version --format '{{json .}}' > work/f2-security/docker-version.json
          docker info --format '{{json .DriverStatus}}' > work/f2-security/docker-storage.json
      - name: Build OCI artifact without RUN or starting the database
        run: |
          python3 tools/security/build_postgres_candidate.py
          python3 tools/security/inspect_postgres_files.py
      - name: Download checksum-verified scanners
        run: python3 tools/security/bootstrap.py --platform linux_amd64
      - name: Scan actual derived artifact only; no native or database approval
        run: |
          .local/security-tools/syft oci-archive:work/f2-security/postgres-derived.oci.tar -o syft-json=work/f2-security/postgres-derived-sbom.json
          .local/security-tools/grype sbom:work/f2-security/postgres-derived-sbom.json -o json --file work/f2-security/postgres-derived-cves.json
          python3 tools/security/summarize_postgres_candidate.py
      - name: Record authenticated Ubuntu transaction metadata without install
        run: |
          sudo apt-get update --error-on=any
          python3 tools/security/prepare_ci_native.py
          python3 tools/security/download_ci_native.py
      - name: Apply exact reviewed CI patch and rescan native files; no database use
        run: |
          python3 tools/security/apply_ci_native_patch.py
          env -u LD_LIBRARY_PATH -u LD_PRELOAD -u LD_AUDIT python3 tools/security/native_chain.py --output-root work/f2-security
          .local/security-tools/syft dir:work/f2-security/native-root --override-default-catalogers dpkg-db-cataloger -o syft-json=work/f2-security/system-native-sbom.json
          .local/security-tools/grype sbom:work/f2-security/system-native-sbom.json -o json --file work/f2-security/system-native-cves.json
          python3 tools/security/summarize_ci_patch.py
      - name: Preserve small review metadata separately from OCI archive
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postgres-static-metadata
          path: |
            work/f2-security/*.json
            work/f2-security/postgres-entrypoint-source.txt
            work/f2-security/candidate-archives/*/copyright
            work/f2-security/native-root/
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve experiment evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postgres-static-experiment
          path: |
            work/f2-security/*.json
            work/f2-security/*.tar
            work/f2-security/postgres-entrypoint-source.txt
            work/f2-security/candidate-archives/*/copyright
            work/f2-security/native-root/
          retention-days: 7
          if-no-files-found: warn
