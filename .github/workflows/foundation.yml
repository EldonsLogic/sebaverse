name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 inspected 2026-11-11
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 inspected 2026-11-11
        with:
          python-version: '3.12'
      - name: Reproduce illustrative economics
        run: python3 tools/model_economics.py
      - name: Validate project artifacts
        run: python3 tools/validate_project.py
      - name: Validate task, agent and phase foundation
        run: python3 tools/check_foundation.py
      - name: Exercise invalid phase transitions and contracts
        run: python3 -m unittest discover -s tools/tests -p test_foundation.py
